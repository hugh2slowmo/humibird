[package]
name = "humibird_store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
futures.workspace = true
sqlez.workspace = true
# Unlike Zed's workspace we depend on SQLite only through `sqlez`, which does
# not enable `bundled` itself. Linking the system SQLite would make the schema
# depend on whichever version the host ships, so the feature is turned on here.
libsqlite3-sys.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
